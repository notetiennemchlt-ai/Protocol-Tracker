<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Protocol</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="page">
  <header id="app-header">
    <div class="header-titles">
      <span class="header-title">Etienne Michelet</span>
      <span class="header-tagline">A public record of my current protocol.</span>
    </div>
    <a
      class="header-youtube"
      href="https://www.youtube.com/channel/UCuEqqmTLeTL5pmE9NLTYPFQ"
      target="_blank"
      rel="noopener noreferrer"
    >YouTube ↗</a>
    <div id="unlock-area">
      <span id="unlock-status">Viewing publicly</span>
    </div>
  </header>

  <main id="protocol-panel" aria-label="Current Protocol Tracker">
    <div class="protocol-header">
      <h2 class="protocol-title">
        Current Protocol Tracker<sup>*</sup>
        <span class="protocol-title-note">*Supplements not included</span>
      </h2>
      <div id="protocol-updated" class="protocol-updated"></div>
    </div>
    <div id="protocol-body" class="protocol-body"></div>
  </main>
</div>

<script type="module" src="js/protocol.js"></script>
</body>
</html>
