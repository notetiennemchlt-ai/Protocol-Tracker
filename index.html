<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Protocol</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="page">
  <header id="app-header">
    <div class="header-titles">
      <span class="header-title">Etienne Michelet</span>
      <span class="header-tagline">A public record of my current protocol.</span>
    </div>
    <a
      class="header-youtube"
      href="https://www.youtube.com/channel/UCuEqqmTLeTL5pmE9NLTYPFQ"
      target="_blank"
      rel="noopener noreferrer"
    >YouTube ↗</a>
    <div id="unlock-area">
      <span id="unlock-status">Viewing publicly</span>
    </div>
  </header>

  <section id="new-protocol-banner" aria-label="New Protocol">
    <ul class="protocol-item-list">
      <li class="protocol-item status-running">
        <span class="protocol-status-dot" aria-hidden="true"></span>
        <div class="protocol-item-body">
          <div class="protocol-item-line">
            <span class="protocol-item-text">New* Dopamine Detox</span>
          </div>
          <div class="protocol-item-note">Implemented personally - not a protocol Andrew Huberman directly talked about</div>
        </div>
      </li>
    </ul>
  </section>

  <div id="shell">
    <aside id="protocol-sidebar" aria-label="Current Protocol Tracker">
      <div class="protocol-header">
        <h2 class="protocol-title">
          Current Protocol Tracker
          <span class="protocol-title-note">*No supplements included</span>
        </h2>
        <div id="protocol-updated" class="protocol-updated"></div>
      </div>
      <div id="protocol-body" class="protocol-body"></div>
    </aside>

    <main id="metrics-area" aria-label="30-Day Focus Metrics">
      <div class="metrics-header">
        <div class="metrics-titles">
          <h2 class="metrics-title">30-Day Focus Metrics</h2>
          <div id="metrics-updated" class="metrics-updated"></div>
        </div>
        <div id="day-indicator" class="day-indicator"></div>
      </div>
      <div id="metric-cards" class="metric-cards"></div>
    </main>
  </div>

  <section id="sleep-panel" aria-label="Current Sleep Protocol">
    <div class="protocol-header">
      <h2 class="protocol-title">Sleep Protocol Tracker</h2>
      <div id="sleep-updated" class="protocol-updated"></div>
    </div>
    <div id="sleep-body" class="protocol-body"></div>
  </section>
</div>

<script type="module" src="js/protocol.js"></script>
<script type="module" src="js/sleep.js"></script>
<script type="module" src="js/metrics.js"></script>
</body>
</html>
