<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stats</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="shell">
  <button type="button" id="protocol-toggle" aria-expanded="true" aria-controls="protocol-sidebar" aria-label="Toggle Current Protocol Tracker sidebar">
    <span class="protocol-toggle-icon" aria-hidden="true"></span>
    <span class="protocol-toggle-label">Protocol</span>
  </button>

  <div id="protocol-backdrop"></div>

  <aside id="protocol-sidebar" aria-label="Current Protocol Tracker">
    <div class="protocol-header">
      <h2 class="protocol-title">Current Protocol Tracker</h2>
      <div id="protocol-updated" class="protocol-updated"></div>
    </div>
    <div id="protocol-body" class="protocol-body"></div>
  </aside>

  <div id="app">
    <header id="app-header">
      <div class="header-titles">
        <span class="header-title">Etienne Michelet</span>
        <span class="header-tagline">A public record of what I'm tracking.</span>
      </div>
      <a
        class="header-youtube"
        href="https://www.youtube.com/channel/UCuEqqmTLeTL5pmE9NLTYPFQ"
        target="_blank"
        rel="noopener noreferrer"
      >YouTube ↗</a>
      <div id="unlock-area">
        <span id="unlock-status">Viewing publicly</span>
      </div>
    </header>

    <main id="cards"></main>
  </div>
</div>

<template id="card-template">
  <section class="card">
    <div class="card-head">
      <div class="card-titles">
        <h2 class="card-label"></h2>
        <div class="card-unit"></div>
        <div class="card-cadence"></div>
      </div>
      <div class="card-hero">
        <div class="hero-value">—</div>
        <div class="hero-delta"></div>
      </div>
    </div>

    <div class="card-chart">
      <div class="chart-empty">No entries yet.</div>
      <svg class="chart-svg" viewBox="0 0 560 180" preserveAspectRatio="none"></svg>
      <div class="chart-tooltip"></div>
    </div>

    <details class="entries-details">
      <summary>All entries</summary>
      <ul class="entries-list"></ul>
    </details>
  </section>
</template>

<script type="module" src="js/app.js"></script>
</body>
</html>
